# Per-project override for agent-passport (templates/workflows/overrides/).
# scripts/apply_workflows.py ships this instead of the stack template
# and fills in the runner. Edit here, not in the repo, or the next rollout
# reverts the change.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
jobs:
  test:
    name: Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format --check)
        run: ruff format --check .

      - name: Type check (mypy --strict on src/ and tests/)
        run: mypy

      - name: Test (pytest with coverage)
        run: pytest --cov=csp_agent_passport --cov-report=term-missing

      - name: Dependency vulnerability scan (pip-audit)
        # Fail the build on any known-vulnerable dependency. `pip-audit`
        # queries the OSV.dev database; default behavior exits non-zero on
        # found vulnerabilities. `--skip-editable` excludes our own editable
        # install from the audit (it isn't on PyPI yet by definition).
        # We intentionally do NOT use --strict, which would also fail on
        # the editable-skip "warning" we just opted into.
        # setuptools is upgraded first: some hosted runner images (notably
        # 3.11) ship a setuptools with a known CVE (e.g. PYSEC-2026-3447),
        # which would otherwise fail this audit on our own toolchain rather
        # than a project dependency.
        run: |
          pip install --upgrade pip setuptools
          pip install pip-audit
          pip-audit --skip-editable
