# Per-project override for agent-passport (templates/workflows/overrides/).
# scripts/apply_workflows.py ships this instead of the stack template
# and fills in the runner. Edit here, not in the repo, or the next rollout
# reverts the change.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clear stale gitleaks download
        # Persistent self-hosted runners brick on a leftover gitleaks.tmp;
        # no-op on hosted runners. See ops/SELF_HOSTED_RUNNERS.md.
        run: rm -f "${RUNNER_TEMP%/_work/_temp}/_tmp/gitleaks.tmp" "${TMPDIR:-/tmp}/gitleaks.tmp"
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

      - name: Dependency vulnerability scan (pip-audit)
        run: pipx run pip-audit .
